<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search and copy developer commands" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171c" />
    <title>Cheatsheet</title>
  </head>
  <body>
    <header class="top">
      <div class="search-wrap">
        <label class="visually-hidden" for="search">Search commands</label>
        <input
          id="search"
          type="search"
          placeholder="Search commands…  (Ctrl+K)"
          aria-keyshortcuts="Control+K"
          autocomplete="off"
          spellcheck="false"
          autofocus
          role="combobox"
          aria-expanded="true"
          aria-controls="results"
          aria-autocomplete="list"
        />
      </div>
      <nav id="filters" class="filters" aria-label="Filter by tool"></nav>
      <div class="status-row">
        <p id="status" class="status" aria-live="polite"></p>
        <p class="hints" aria-hidden="true">
          <kbd>↑</kbd><kbd>↓</kbd> select · <kbd>Enter</kbd> copy · <kbd>Esc</kbd> clear ·
          <kbd>Alt</kbd>+<kbd>0–7</kbd> filter
        </p>
      </div>
    </header>

    <main>
      <ul id="results" class="results" role="listbox" aria-label="Commands"></ul>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
