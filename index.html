<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search and copy developer commands" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171c" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Cheatsheet</title>
  </head>
  <body>
    <header class="top">
      <div class="search-wrap">
        <label class="visually-hidden" for="search">Search commands</label>
        <input
          id="search"
          type="search"
          placeholder="Search commands…  (Ctrl+K)"
          aria-keyshortcuts="Control+K"
          autocomplete="off"
          spellcheck="false"
          autofocus
          role="combobox"
          aria-expanded="true"
          aria-controls="results"
          aria-autocomplete="list"
        />
      </div>
      <nav id="filters" class="filters" aria-label="Filter by tool"></nav>
      <div class="status-row">
        <p id="status" class="status" aria-live="polite"></p>
        <p class="hints" aria-hidden="true">
          <kbd>↑</kbd><kbd>↓</kbd> select · <kbd>Enter</kbd> copy / fill · <kbd>Esc</kbd> clear ·
          <kbd>Alt</kbd>+<kbd>0–7</kbd> filter
        </p>
      </div>
    </header>

    <main>
      <ul id="results" class="results" role="listbox" aria-label="Commands"></ul>
    </main>

    <dialog id="fill" class="fill" aria-labelledby="fill-title">
      <form method="dialog">
        <h2 id="fill-title" class="fill-title">Fill in placeholders</h2>
        <p class="fill-description"></p>
        <code class="fill-preview" aria-live="polite"></code>
        <div class="fill-fields"></div>
        <p class="fill-example"></p>
        <div class="fill-actions">
          <button type="button" class="button" data-action="template" title="Shift+Enter">
            Copy template
          </button>
          <span class="fill-spacer"></span>
          <button type="button" class="button" data-action="cancel" title="Esc">Cancel</button>
          <button type="submit" class="button button-primary">Copy</button>
        </div>
        <p class="fill-hints" aria-hidden="true">
          <kbd>Enter</kbd> next field / copy · <kbd>Shift</kbd>+<kbd>Enter</kbd> copy template ·
          <kbd>Esc</kbd> cancel
        </p>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
