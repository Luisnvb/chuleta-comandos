# Source: pdfs/claude-code.pdf (October 2026)

# --- terminal ---
- tool: claude-code
  category: terminal
  command: 'claude'
  description: Opens an interactive session in the current folder.
  tags: [start, session]
- tool: claude-code
  category: terminal
  command: 'claude "{message}"'
  description: Opens the session with a first message already written.
  tags: [start, prompt]
  example: 'claude "explain this project"'
- tool: claude-code
  category: terminal
  command: 'claude -p "{query}"'
  description: 'Non-interactive mode: answers and exits. Ideal for scripts and CI.'
  tags: [print, headless, scripts, ci]
- tool: claude-code
  category: terminal
  command: 'cat {file} | claude -p "{query}"'
  description: Pipes content in for Claude to analyse.
  tags: [pipe, headless]
  example: 'cat logs.txt | claude -p "explain"'
- tool: claude-code
  category: terminal
  command: 'claude -c'
  description: Continues the most recent conversation in this folder.
  tags: [continue, session]
- tool: claude-code
  category: terminal
  command: 'claude -r "{name}"'
  description: Resumes a specific session by ID or name (without an argument, opens the picker).
  tags: [resume, session]
- tool: claude-code
  category: terminal
  command: 'claude update'
  description: Updates to the latest version.
  tags: [update, upgrade]
- tool: claude-code
  category: terminal
  command: 'claude doctor'
  description: Checks the installation and settings, without opening a session.
  tags: [diagnostics, doctor]
- tool: claude-code
  category: terminal
  command: 'claude auth login'
  description: Logs in to your account.
  tags: [login, authentication]
- tool: claude-code
  category: terminal
  command: 'claude auth status'
  description: Shows the authentication status.
  tags: [login, authentication, status]
- tool: claude-code
  category: terminal
  command: 'claude mcp'
  description: Configures MCP servers (external tools).
  tags: [mcp, servers, tools]
- tool: claude-code
  category: terminal
  command: 'claude plugin install {plugin}'
  description: Installs a plugin (also list, enable, disable…).
  tags: [plugins, install]
- tool: claude-code
  category: terminal
  command: 'claude agents'
  description: 'Agents view: monitors background sessions.'
  tags: [agents, background]

# --- options (flags) ---
- tool: claude-code
  category: flags
  command: 'claude --model {model}'
  description: Chooses the model for this session (sonnet, opus, haiku).
  tags: [model]
  example: 'claude --model opus'
- tool: claude-code
  category: flags
  command: 'claude --effort {level}'
  description: Reasoning level, from low to max (the available ones depend on the model).
  tags: [effort, reasoning]
  example: 'claude --effort high'
- tool: claude-code
  category: flags
  command: 'claude --permission-mode {mode}'
  description: 'Starts in a permission mode: default, acceptEdits, plan, auto…'
  tags: [permissions, mode, plan]
  example: 'claude --permission-mode plan'
- tool: claude-code
  category: flags
  command: 'claude --add-dir {path}'
  description: Gives access to additional folders.
  tags: [folders, directories]
  example: 'claude --add-dir ../other-folder'
- tool: claude-code
  category: flags
  command: 'claude -w {name}'
  description: Works in an isolated git worktree.
  tags: [worktree, git, isolated]
- tool: claude-code
  category: flags
  command: 'claude -n "{name}"'
  description: Names the session so you can resume it later with -r.
  tags: [name, session]
  example: 'claude -n "my-task"'
- tool: claude-code
  category: flags
  command: 'claude --bg "{task}"'
  description: Launches the session as a background agent.
  tags: [background, agent]
  example: 'claude --bg "investigate the failing test"'
- tool: claude-code
  category: flags
  command: 'claude -p "{query}" --output-format json'
  description: Output as text, json or stream-json (with -p).
  tags: [json, output, headless]
- tool: claude-code
  category: flags
  command: 'claude -p "{query}" --max-turns 3'
  description: Limits the agent's turns (with -p).
  tags: [turns, limit, headless]
- tool: claude-code
  category: flags
  command: 'claude --allowedTools "{rule}"'
  description: Tools that run without asking for permission.
  tags: [permissions, tools]
  example: 'claude --allowedTools "Bash(git *)"'
- tool: claude-code
  category: flags
  command: 'claude --append-system-prompt "{instructions}"'
  description: Appends instructions to the system prompt.
  tags: [system prompt, instructions]
- tool: claude-code
  category: flags
  command: 'claude --safe-mode'
  description: Starts without customizations, to debug a broken configuration.
  tags: [debug, safe]
- tool: claude-code
  category: flags
  command: 'claude --dangerously-skip-permissions'
  description: Skips all confirmations. Use it only in isolated environments.
  tags: [permissions, dangerous, yolo]

# --- commands inside the session ---
- tool: claude-code
  category: slash
  command: '/init'
  description: Generates an initial CLAUDE.md with the project context.
  tags: [claude.md, initialize]
- tool: claude-code
  category: slash
  command: '/memory'
  description: Edits the CLAUDE.md files and auto memory.
  tags: [memory, claude.md]
- tool: claude-code
  category: slash
  command: '/plan {task}'
  description: 'Enters plan mode: analyses and proposes before touching code.'
  tags: [plan, planning]
- tool: claude-code
  category: slash
  command: '/model'
  description: Switches model.
  tags: [model]
- tool: claude-code
  category: slash
  command: '/effort'
  description: Adjusts the effort level.
  tags: [effort, reasoning]
- tool: claude-code
  category: slash
  command: '/clear'
  description: New conversation with an empty context (alias /new, /reset).
  tags: [clear, new, context]
- tool: claude-code
  category: slash
  command: '/compact {instructions}'
  description: Summarizes the conversation to free up context.
  tags: [compact, context, summarize]
- tool: claude-code
  category: slash
  command: '/context'
  description: Shows what is taking up the context window.
  tags: [context, tokens]
- tool: claude-code
  category: slash
  command: '/resume'
  description: Goes back to an earlier conversation (alias /continue).
  tags: [resume, session]
- tool: claude-code
  category: slash
  command: '/rewind'
  description: Restores code and/or conversation to an earlier point (alias /undo).
  tags: [undo, rewind]
- tool: claude-code
  category: slash
  command: '/diff'
  description: Reviews the working tree changes, including Claude's.
  tags: [changes, diff]
- tool: claude-code
  category: slash
  command: '/code-review'
  description: Reviews the diff for bugs; --fix fixes them (alias /review).
  tags: [review, bugs]
- tool: claude-code
  category: slash
  command: '/security-review'
  description: Looks for vulnerabilities in your branch's changes.
  tags: [security, vulnerabilities]
- tool: claude-code
  category: slash
  command: '/permissions'
  description: Allow / ask / deny rules for tools.
  tags: [permissions]
- tool: claude-code
  category: slash
  command: '/mcp'
  description: Manages MCP connections and their authentication.
  tags: [mcp, servers]
- tool: claude-code
  category: slash
  command: '/btw {question}'
  description: Side question that isn't added to the history.
  tags: [question, side]
- tool: claude-code
  category: slash
  command: '/tasks'
  description: View and manage background work.
  tags: [tasks, background]
- tool: claude-code
  category: slash
  command: '/skills'
  description: Lists the available skills.
  tags: [skills]
- tool: claude-code
  category: slash
  command: '/hooks'
  description: Shows the configured hooks.
  tags: [hooks]
- tool: claude-code
  category: slash
  command: '/agents'
  description: Manages subagents.
  tags: [agents, subagents]
- tool: claude-code
  category: slash
  command: '/add-dir {path}'
  description: Adds a folder to the session.
  tags: [folders, directories]
- tool: claude-code
  category: slash
  command: '/cd {path}'
  description: Moves the session to another folder.
  tags: [folders, directory]
- tool: claude-code
  category: slash
  command: '/usage'
  description: Session cost, plan limits and stats (alias /cost).
  tags: [cost, usage, limits]
- tool: claude-code
  category: slash
  command: '/config'
  description: Settings (theme, model, style…).
  tags: [settings, configuration]
- tool: claude-code
  category: slash
  command: '/status'
  description: Version, account and connection.
  tags: [status, version, account]
- tool: claude-code
  category: slash
  command: '/export {file}'
  description: Exports the conversation as text.
  tags: [export, save]
- tool: claude-code
  category: slash
  command: '/doctor'
  description: Environment check with suggested fixes.
  tags: [diagnostics]
- tool: claude-code
  category: slash
  command: '/help'
  description: General help.
  tags: [help]

# --- keyboard shortcuts ---
- tool: claude-code
  category: shortcuts
  command: 'Esc'
  description: Interrupts Claude (keeps the work done) or closes a dialog.
  tags: [keyboard, interrupt, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Esc Esc'
  description: 'With text: clears the draft. Empty: opens the rewind menu.'
  tags: [keyboard, rewind, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Shift+Tab'
  description: 'Cycles permission modes: manual, accept edits, plan, auto…'
  tags: [keyboard, permissions, plan, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Ctrl+C'
  description: Interrupts; with an empty prompt, pressing it again exits.
  tags: [keyboard, exit, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Ctrl+R'
  description: Reverse search through the prompt history.
  tags: [keyboard, history, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Ctrl+O'
  description: Transcript viewer with tool details.
  tags: [keyboard, transcript, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Ctrl+B'
  description: Sends the running command or agent to the background.
  tags: [keyboard, background, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Ctrl+T'
  description: Shows or hides Claude's task list.
  tags: [keyboard, tasks, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Alt+V'
  description: Pastes an image from the clipboard (Ctrl+V outside Windows).
  tags: [keyboard, image, paste, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Ctrl+G'
  description: Edits the prompt in your text editor.
  tags: [keyboard, editor, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Ctrl+S'
  description: Stashes the prompt and brings it back later.
  tags: [keyboard, save, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Alt+P'
  description: Switches model (Option on Mac).
  tags: [keyboard, model, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Alt+T'
  description: Toggles extended thinking (Option on Mac).
  tags: [keyboard, reasoning, thinking, shortcut]
- tool: claude-code
  category: shortcuts
  command: 'Shift+Enter'
  description: New line in the prompt (also \ + Enter or Ctrl+J).
  tags: [keyboard, new line, shortcut]

# --- prefixes ---
- tool: claude-code
  category: prefixes
  command: '/'
  description: Runs a command or skill.
  tags: [slash, command, skill]
- tool: claude-code
  category: prefixes
  command: '! {command}'
  description: 'Shell mode: runs the command and Claude responds to its output.'
  tags: [shell, bash, terminal]
  example: '! npm test'
- tool: claude-code
  category: prefixes
  command: '@{path}'
  description: Mentions a file (autocompletes paths).
  tags: [file, mention]
  example: '@src/main.js'
- tool: claude-code
  category: prefixes
  command: '?'
  description: With an empty prompt, shows the shortcuts panel.
  tags: [help, shortcuts]
