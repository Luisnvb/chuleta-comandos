# Windows CMD (cmd.exe). Not from a PDF: written for this project.

# --- navigation and files ---
- tool: cmd
  category: navigation and files
  command: 'cd'
  description: Shows the current directory.
  tags: [directory, pwd, path]
- tool: cmd
  category: navigation and files
  command: 'cd {path}'
  description: Changes to a directory on the same drive.
  tags: [directory, change]
- tool: cmd
  category: navigation and files
  command: 'cd ..'
  description: Goes up to the parent directory.
  tags: [directory, parent]
- tool: cmd
  category: navigation and files
  command: 'cd /d {path}'
  description: Changes directory and drive at the same time.
  tags: [directory, drive]
  example: 'cd /d D:\projects'
- tool: cmd
  category: navigation and files
  command: 'dir'
  description: Lists files and folders in the current directory.
  tags: [list, ls]
- tool: cmd
  category: navigation and files
  command: 'dir /a'
  description: Lists including hidden and system files.
  tags: [list, hidden, ls]
- tool: cmd
  category: navigation and files
  command: 'dir /s /b {pattern}'
  description: Finds files by name in subfolders, showing only paths.
  tags: [search, find, recursive]
  example: 'dir /s /b *.log'
- tool: cmd
  category: navigation and files
  command: 'tree /f'
  description: Shows the folder structure as a tree, with files.
  tags: [tree, structure]
- tool: cmd
  category: navigation and files
  command: 'mkdir {path}'
  description: Creates a directory, including intermediate ones.
  tags: [create, folder, md]
  example: 'mkdir dir\subdir'
- tool: cmd
  category: navigation and files
  command: 'type nul > {file}'
  description: Creates an empty file (like touch).
  tags: [create, file, touch]
- tool: cmd
  category: navigation and files
  command: 'copy {source} {destination}'
  description: Copies one or more files.
  tags: [copy]
- tool: cmd
  category: navigation and files
  command: 'xcopy {source} {destination} /e /i'
  description: Copies a folder with its subfolders (including empty ones).
  tags: [copy, folder, recursive]
- tool: cmd
  category: navigation and files
  command: 'robocopy {source} {destination} /e'
  description: Robust folder copy; /mir mirrors (deletes extra files in the destination).
  tags: [copy, sync, backup]
- tool: cmd
  category: navigation and files
  command: 'move {source} {destination}'
  description: Moves files or folders.
  tags: [move]
- tool: cmd
  category: navigation and files
  command: 'ren {file} {new_name}'
  description: Renames a file or folder.
  tags: [rename]
- tool: cmd
  category: navigation and files
  command: 'del {file}'
  description: Deletes files. Doesn't use the recycle bin.
  tags: [delete, remove, rm]
- tool: cmd
  category: navigation and files
  command: 'del /s /q {pattern}'
  description: Deletes matching files in all subfolders, without asking.
  tags: [delete, recursive]
  example: 'del /s /q *.tmp'
- tool: cmd
  category: navigation and files
  command: 'rmdir /s /q {directory}'
  description: Deletes a folder and all its contents without asking.
  tags: [delete, folder, rd]
  example: 'rmdir /s /q node_modules'
- tool: cmd
  category: navigation and files
  command: 'mklink /d {link} {target}'
  description: Creates a symbolic link to a folder (needs admin or developer mode).
  tags: [symlink, link]
- tool: cmd
  category: navigation and files
  command: 'attrib +h {file}'
  description: Hides a file (-h to show it, +r read-only).
  tags: [attributes, hide]
- tool: cmd
  category: navigation and files
  command: 'start .'
  description: Opens the current folder in File Explorer.
  tags: [explorer, open]

# --- view and edit content ---
- tool: cmd
  category: view and edit
  command: 'type {file}'
  description: Prints the contents of a file.
  tags: [read, cat, show]
- tool: cmd
  category: view and edit
  command: 'more {file}'
  description: Shows a file page by page (space advances, q quits).
  tags: [read, pager, less]
- tool: cmd
  category: view and edit
  command: 'fc {file_a} {file_b}'
  description: Compares two files.
  tags: [compare, diff]
- tool: cmd
  category: view and edit
  command: 'notepad {file}'
  description: Opens a file in Notepad.
  tags: [editor, edit]
- tool: cmd
  category: view and edit
  command: 'find /c /v "" {file}'
  description: Counts the lines of a file.
  tags: [count, lines, wc]

# --- search and filter ---
- tool: cmd
  category: search and filter
  command: 'findstr /s /i /n "{text}" {pattern}'
  description: Searches for text in files recursively, case-insensitive and with line numbers.
  tags: [search, grep, text]
  example: 'findstr /s /i /n "TODO" *.js'
- tool: cmd
  category: search and filter
  command: '{command} | findstr "{text}"'
  description: Filters a command's output.
  tags: [filter, grep, pipe]
  example: 'tasklist | findstr "node"'
- tool: cmd
  category: search and filter
  command: 'where {command}'
  description: Shows the path of a command's executable.
  tags: [path, executable, which]
- tool: cmd
  category: search and filter
  command: '{command} | sort'
  description: Sorts the output lines.
  tags: [sort]

# --- processes and system ---
- tool: cmd
  category: processes and system
  command: 'tasklist'
  description: Lists the running processes.
  tags: [processes, ps]
- tool: cmd
  category: processes and system
  command: 'taskkill /pid {pid} /f'
  description: Force-closes a process by its PID.
  tags: [kill, terminate]
- tool: cmd
  category: processes and system
  command: 'taskkill /im {process} /f'
  description: Force-closes all processes with that name.
  tags: [kill, terminate]
  example: 'taskkill /im node.exe /f'
- tool: cmd
  category: processes and system
  command: 'systeminfo'
  description: Detailed system information (version, RAM, boot time…).
  tags: [system, info]
- tool: cmd
  category: processes and system
  command: 'ver'
  description: Windows version.
  tags: [version, system]
- tool: cmd
  category: processes and system
  command: 'hostname'
  description: Computer name.
  tags: [computer, name]
- tool: cmd
  category: processes and system
  command: 'whoami'
  description: Current user (whoami /groups to see groups).
  tags: [user]
- tool: cmd
  category: processes and system
  command: 'start "" {program}'
  description: Opens a program, file or URL in a new window.
  tags: [open, run]
  example: 'start "" https://example.com'
- tool: cmd
  category: processes and system
  command: 'shutdown /r /t 0'
  description: Restarts the computer immediately.
  tags: [restart, reboot]
- tool: cmd
  category: processes and system
  command: 'shutdown /s /t 0'
  description: Shuts down the computer immediately.
  tags: [shutdown, power off]
- tool: cmd
  category: processes and system
  command: 'sfc /scannow'
  description: Checks and repairs system files (as administrator).
  tags: [repair, system, admin]
- tool: cmd
  category: processes and system
  command: 'chkdsk {drive}: /f'
  description: Checks and repairs disk errors (as administrator).
  tags: [disk, repair, admin]
  example: 'chkdsk C: /f'

# --- environment variables ---
- tool: cmd
  category: environment variables
  command: 'set'
  description: Lists all environment variables.
  tags: [env, variables, list]
- tool: cmd
  category: environment variables
  command: 'echo %{variable}%'
  description: Shows the value of a variable.
  tags: [env, variables, show]
  example: 'echo %PATH%'
- tool: cmd
  category: environment variables
  command: 'set {variable}={value}'
  description: Sets a variable for the current session only.
  tags: [env, variables, set]
  example: 'set NODE_ENV=production'
- tool: cmd
  category: environment variables
  command: 'setx {variable} "{value}"'
  description: Sets a user variable permanently (affects new windows).
  tags: [env, variables, permanent]
- tool: cmd
  category: environment variables
  command: 'echo %errorlevel%'
  description: Exit code of the last command (0 = success).
  tags: [exit code, error]

# --- network ---
- tool: cmd
  category: network
  command: 'ipconfig'
  description: Shows the IP addresses of each adapter.
  tags: [ip, network]
- tool: cmd
  category: network
  command: 'ipconfig /all'
  description: Full network configuration (MAC, DNS, DHCP…).
  tags: [ip, dns, mac]
- tool: cmd
  category: network
  command: 'ipconfig /flushdns'
  description: Flushes the DNS cache.
  tags: [dns, cache, clear]
- tool: cmd
  category: network
  command: 'ping {host}'
  description: Checks connectivity with a host (-t continuous).
  tags: [connectivity, network]
- tool: cmd
  category: network
  command: 'tracert {host}'
  description: Shows the network hops to a host.
  tags: [traceroute, route]
- tool: cmd
  category: network
  command: 'nslookup {domain}'
  description: Looks up a domain's DNS records.
  tags: [dns, domain]
- tool: cmd
  category: network
  command: 'netstat -ano'
  description: Connections and open ports with the process PID.
  tags: [ports, connections]
- tool: cmd
  category: network
  command: 'netstat -ano | findstr :{port}'
  description: Finds out which process is using a port.
  tags: [ports, pid]
  example: 'netstat -ano | findstr :8000'
- tool: cmd
  category: network
  command: 'curl -I {url}'
  description: HTTP request showing only the headers (curl ships with Windows 10+).
  tags: [http, headers]

# --- packages (winget) ---
- tool: cmd
  category: packages
  command: 'winget search {name}'
  description: Searches for a program in the winget repository.
  tags: [winget, search, install]
- tool: cmd
  category: packages
  command: 'winget install --id {id}'
  description: Installs a program by its ID.
  tags: [winget, install]
  example: 'winget install --id Git.Git'
- tool: cmd
  category: packages
  command: 'winget upgrade --all'
  description: Updates all programs installed with winget.
  tags: [winget, update, upgrade]
- tool: cmd
  category: packages
  command: 'winget list'
  description: Lists the installed programs.
  tags: [winget, list]

# --- redirection and shell ---
- tool: cmd
  category: redirection and shell
  command: '{command} > {file}'
  description: Sends the output to a file (overwrites).
  tags: [redirect, output]
- tool: cmd
  category: redirection and shell
  command: '{command} >> {file}'
  description: Appends the output to the end of a file.
  tags: [redirect, append]
- tool: cmd
  category: redirection and shell
  command: '{command} > {file} 2>&1'
  description: Sends the output and the errors to the same file.
  tags: [redirect, errors, stderr]
- tool: cmd
  category: redirection and shell
  command: '{command} > nul'
  description: Discards a command's output.
  tags: [silence, nul, 'null']
- tool: cmd
  category: redirection and shell
  command: '{command} | clip'
  description: Copies a command's output to the clipboard.
  tags: [clipboard, copy]
  example: 'ipconfig | clip'
- tool: cmd
  category: redirection and shell
  command: '{command1} && {command2}'
  description: Runs the second command only if the first one succeeded.
  tags: [chain, and]
- tool: cmd
  category: redirection and shell
  command: '{command1} || {command2}'
  description: Runs the second command only if the first one failed.
  tags: [chain, or]
- tool: cmd
  category: redirection and shell
  command: 'doskey /history'
  description: Shows the session's command history.
  tags: [history]
- tool: cmd
  category: redirection and shell
  command: 'cls'
  description: Clears the screen.
  tags: [clear]
- tool: cmd
  category: redirection and shell
  command: '{command} /?'
  description: Shows a command's help.
  tags: [help]
  example: 'robocopy /?'

# --- keyboard shortcuts ---
- tool: cmd
  category: shortcuts
  command: 'F7'
  description: Opens the command history as a list.
  tags: [keyboard, history, shortcut]
- tool: cmd
  category: shortcuts
  command: 'F3'
  description: Repeats the last command.
  tags: [keyboard, repeat, shortcut]
- tool: cmd
  category: shortcuts
  command: 'Ctrl+C'
  description: Interrupts the running command.
  tags: [keyboard, interrupt, shortcut]
- tool: cmd
  category: shortcuts
  command: 'Tab'
  description: Autocompletes paths and file names.
  tags: [keyboard, autocomplete, shortcut]
