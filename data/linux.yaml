# Source: pdfs/comandos-linux.pdf

# --- navigation and files ---
- tool: linux
  category: navigation and files
  command: 'pwd'
  description: Shows the current directory.
  tags: [directory, path, where]
- tool: linux
  category: navigation and files
  command: 'ls -lah'
  description: Lists files with details, hidden ones included, with human-readable sizes.
  tags: [list, dir]
- tool: linux
  category: navigation and files
  command: 'cd {path}'
  description: Changes to a directory.
  tags: [directory, change]
  example: 'cd /var/www'
- tool: linux
  category: navigation and files
  command: 'cd ..'
  description: Goes up to the parent directory.
  tags: [directory, parent]
- tool: linux
  category: navigation and files
  command: 'cd ~'
  description: Goes to the user's home directory.
  tags: [directory, home]
- tool: linux
  category: navigation and files
  command: 'cd -'
  description: Goes back to the previous directory.
  tags: [directory, previous]
- tool: linux
  category: navigation and files
  command: 'mkdir -p {path}'
  description: Creates directories, including intermediate ones.
  tags: [create, folder, directory]
  example: 'mkdir -p dir/subdir'
- tool: linux
  category: navigation and files
  command: 'touch {file}'
  description: Creates an empty file or updates its timestamp.
  tags: [create, file]
- tool: linux
  category: navigation and files
  command: 'cp -r {source} {destination}'
  description: Copies files or directories (recursive).
  tags: [copy]
- tool: linux
  category: navigation and files
  command: 'mv {source} {destination}'
  description: Moves or renames.
  tags: [move, rename]
- tool: linux
  category: navigation and files
  command: 'rm {file}'
  description: Deletes a file. No recycle bin.
  tags: [delete, remove]
- tool: linux
  category: navigation and files
  command: 'rm -r {directory}'
  description: Deletes a directory and its contents. No recycle bin; be careful with rm -rf.
  tags: [delete, remove, folder]
- tool: linux
  category: navigation and files
  command: 'ln -s {target} {link}'
  description: Creates a symbolic link.
  tags: [symlink, link]
- tool: linux
  category: navigation and files
  command: 'tree'
  description: Shows the directory structure as a tree (may need to be installed).
  tags: [tree, structure]

# --- view and edit content ---
- tool: linux
  category: view and edit
  command: 'cat {file}'
  description: Prints the full contents of a file.
  tags: [read, show, print]
- tool: linux
  category: view and edit
  command: 'less {file}'
  description: Opens a file in a pager (q to quit, / to search).
  tags: [read, pager]
- tool: linux
  category: view and edit
  command: 'head -n 20 {file}'
  description: Shows the first lines of a file.
  tags: [first, start, head]
- tool: linux
  category: view and edit
  command: 'tail -n 20 {file}'
  description: Shows the last lines of a file.
  tags: [last, end, tail]
- tool: linux
  category: view and edit
  command: 'tail -f {file}'
  description: Follows a file in real time.
  tags: [logs, follow]
  example: 'tail -f app.log'
- tool: linux
  category: view and edit
  command: 'nano {file}'
  description: Simple terminal text editor.
  tags: [editor, edit]
- tool: linux
  category: view and edit
  command: 'vim {file}'
  description: Advanced terminal text editor.
  tags: [editor, edit, vi]
- tool: linux
  category: view and edit
  command: 'wc -l {file}'
  description: Counts lines (-w words, -c bytes).
  tags: [count, lines]
- tool: linux
  category: view and edit
  command: 'diff {file_a} {file_b}'
  description: Compares two files line by line.
  tags: [compare, diff]

# --- search and filter ---
- tool: linux
  category: search and filter
  command: 'find . -name "{pattern}"'
  description: Finds files by name from the current directory.
  tags: [search, files, find]
  example: 'find . -name "*.txt"'
- tool: linux
  category: search and filter
  command: 'grep -rn "{text}" .'
  description: Searches for text inside files, with line numbers.
  tags: [search, text]
- tool: linux
  category: search and filter
  command: 'grep -i "{text}" {file}'
  description: Searches for text ignoring case.
  tags: [search, case-insensitive]
- tool: linux
  category: search and filter
  command: 'grep -v "{text}" {file}'
  description: Shows the lines that do NOT match.
  tags: [search, invert, exclude]
- tool: linux
  category: search and filter
  command: 'sort | uniq -c'
  description: Sorts and counts repeated lines.
  tags: [sort, count, duplicates]
- tool: linux
  category: search and filter
  command: "cut -d',' -f1"
  description: Extracts columns from delimited text.
  tags: [columns, csv]
- tool: linux
  category: search and filter
  command: "awk '{print $1}'"
  description: Processes text by columns.
  tags: [columns, text]
- tool: linux
  category: search and filter
  command: "sed 's/{old}/{new}/g' {file}"
  description: Replaces text in a stream or file (-i to edit in place).
  tags: [replace, substitute]
- tool: linux
  category: search and filter
  command: 'which {command}'
  description: Shows the path of a command's executable.
  tags: [path, executable, where]

# --- permissions and owners ---
- tool: linux
  category: permissions
  command: 'chmod 755 {file}'
  description: Changes permissions (rwx = 4+2+1 for user, group, others).
  tags: [permissions, chmod]
- tool: linux
  category: permissions
  command: 'chmod +x {file}'
  description: Makes a file executable.
  tags: [permissions, executable]
  example: 'chmod +x script.sh'
- tool: linux
  category: permissions
  command: 'chown {user}:{group} {file}'
  description: Changes a file's owner.
  tags: [owner]
- tool: linux
  category: permissions
  command: 'sudo {command}'
  description: Runs a command as administrator.
  tags: [admin, root, superuser]
- tool: linux
  category: permissions
  command: 'whoami'
  description: Shows your current user.
  tags: [user]
- tool: linux
  category: permissions
  command: 'id'
  description: Shows your user and your groups.
  tags: [user, groups]

# --- processes and system ---
- tool: linux
  category: processes and system
  command: 'ps aux'
  description: Lists all running processes.
  tags: [processes, process]
- tool: linux
  category: processes and system
  command: 'top'
  description: Interactive process and resource monitor.
  tags: [processes, monitor, cpu]
- tool: linux
  category: processes and system
  command: 'htop'
  description: More visual interactive process monitor (may need to be installed).
  tags: [processes, monitor, cpu]
- tool: linux
  category: processes and system
  command: 'kill {pid}'
  description: Terminates a process by its PID.
  tags: [kill, terminate, process]
- tool: linux
  category: processes and system
  command: 'kill -9 {pid}'
  description: Forces a process to terminate.
  tags: [kill, force, process]
- tool: linux
  category: processes and system
  command: 'pkill {name}'
  description: Terminates processes by name.
  tags: [kill, process]
- tool: linux
  category: processes and system
  command: '{command} &'
  description: Runs a command in the background.
  tags: [background]
- tool: linux
  category: processes and system
  command: 'jobs'
  description: Lists the shell's background jobs.
  tags: [background, jobs]
- tool: linux
  category: processes and system
  command: 'fg'
  description: Brings a background job to the foreground.
  tags: [background, foreground]
- tool: linux
  category: processes and system
  command: 'df -h'
  description: Free space on the disks.
  tags: [disk, space]
- tool: linux
  category: processes and system
  command: 'du -sh *'
  description: Size of each item in the directory.
  tags: [disk, size]
- tool: linux
  category: processes and system
  command: 'free -h'
  description: RAM usage.
  tags: [memory, ram]
- tool: linux
  category: processes and system
  command: 'uname -a'
  description: Kernel and system information.
  tags: [system, kernel, version]
- tool: linux
  category: processes and system
  command: 'uptime'
  description: Time since boot and load average.
  tags: [system, load]
- tool: linux
  category: processes and system
  command: 'systemctl status {service}'
  description: Status of a service (also start, stop, restart, enable).
  tags: [service, systemd, daemon]
  example: 'systemctl status nginx'
- tool: linux
  category: processes and system
  command: 'journalctl -u {service} -f'
  description: A service's logs in real time.
  tags: [logs, service, systemd]

# --- network ---
- tool: linux
  category: network
  command: 'ip a'
  description: Shows interfaces and IP addresses.
  tags: [ip, interfaces, network]
- tool: linux
  category: network
  command: 'ping -c 4 {host}'
  description: Checks connectivity with a host.
  tags: [connectivity, network]
- tool: linux
  category: network
  command: 'curl -I {url}'
  description: Makes an HTTP request showing only the headers.
  tags: [http, headers]
  example: 'curl -I https://example.com'
- tool: linux
  category: network
  command: 'wget {url}'
  description: Downloads a file.
  tags: [download]
- tool: linux
  category: network
  command: 'ssh {user}@{host}'
  description: Secure remote connection.
  tags: [remote, server]
- tool: linux
  category: network
  command: 'scp {file} {user}@{host}:{path}'
  description: Copies files over SSH.
  tags: [copy, remote, ssh]
- tool: linux
  category: network
  command: 'rsync -avz {source} {destination}'
  description: Synchronizes files efficiently.
  tags: [sync, copy]
- tool: linux
  category: network
  command: 'ss -tulpn'
  description: Open ports and the processes listening on them.
  tags: [ports, netstat]

# --- compression ---
- tool: linux
  category: compression
  command: 'tar -czvf {archive}.tar.gz {directory}'
  description: Creates a compressed .tar.gz archive.
  tags: [compress, tar, gzip]
  example: 'tar -czvf backup.tar.gz dir'
- tool: linux
  category: compression
  command: 'tar -xzvf {archive}.tar.gz'
  description: Extracts a .tar.gz.
  tags: [decompress, extract, tar]
- tool: linux
  category: compression
  command: 'zip -r {archive}.zip {directory}'
  description: Compresses a directory into a zip file.
  tags: [compress, zip]
- tool: linux
  category: compression
  command: 'unzip {archive}.zip'
  description: Extracts a zip file.
  tags: [decompress, extract, zip]

# --- packages ---
- tool: linux
  category: packages
  command: 'sudo apt update && sudo apt upgrade'
  description: 'Debian/Ubuntu: updates package indexes and packages.'
  tags: [apt, update, upgrade, debian, ubuntu]
- tool: linux
  category: packages
  command: 'sudo apt install {package}'
  description: 'Debian/Ubuntu: installs a package.'
  tags: [apt, install, debian, ubuntu]
- tool: linux
  category: packages
  command: 'sudo dnf install {package}'
  description: 'Fedora/RHEL: installs a package.'
  tags: [dnf, install, fedora]
- tool: linux
  category: packages
  command: 'sudo pacman -S {package}'
  description: 'Arch: installs a package.'
  tags: [pacman, install, arch]

# --- redirection and shell ---
- tool: linux
  category: redirection and shell
  command: '{command} > {file}'
  description: Sends the output to a file (overwrites).
  tags: [redirect, output]
- tool: linux
  category: redirection and shell
  command: '{command} >> {file}'
  description: Appends the output to the end of a file.
  tags: [redirect, append]
- tool: linux
  category: redirection and shell
  command: '{command} 2> {file}'
  description: Redirects errors to a file.
  tags: [redirect, errors, stderr]
  example: 'npm run build 2> err.log'
- tool: linux
  category: redirection and shell
  command: '{command1} | {command2}'
  description: 'Pipe: the output of one is the input of the other.'
  tags: [pipe]
- tool: linux
  category: redirection and shell
  command: '{command1} && {command2}'
  description: Runs the second command only if the first one succeeded.
  tags: [chain, and]
- tool: linux
  category: redirection and shell
  command: 'history'
  description: Shows the command history.
  tags: [history]
- tool: linux
  category: redirection and shell
  command: '!!'
  description: Repeats the last command (handy with sudo !!).
  tags: [history, repeat]
- tool: linux
  category: redirection and shell
  command: "alias {name}='{command}'"
  description: Creates a command shortcut (save it in ~/.bashrc).
  tags: [alias, shortcut]
  example: "alias ll='ls -lah'"
- tool: linux
  category: redirection and shell
  command: 'man {command}'
  description: Opens a command's manual.
  tags: [help, manual]
- tool: linux
  category: redirection and shell
  command: '{command} --help'
  description: Shows a command's quick help.
  tags: [help]

# --- keyboard shortcuts ---
- tool: linux
  category: shortcuts
  command: 'Ctrl+C'
  description: Interrupts the current process.
  tags: [keyboard, interrupt, shortcut]
- tool: linux
  category: shortcuts
  command: 'Ctrl+Z'
  description: Suspends the current process (resume it with fg).
  tags: [keyboard, suspend, shortcut]
- tool: linux
  category: shortcuts
  command: 'Ctrl+R'
  description: Searches the command history.
  tags: [keyboard, history, shortcut]
- tool: linux
  category: shortcuts
  command: 'Tab'
  description: Autocompletes commands and paths.
  tags: [keyboard, autocomplete, shortcut]
