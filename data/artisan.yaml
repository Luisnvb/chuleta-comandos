# Source: pdfs/comandos-artisan-laravel.pdf
# The PDF omits the "php artisan" prefix in most rows; here every command is complete.

# --- basics ---
- tool: artisan
  category: basics
  command: 'php artisan list'
  description: Lists all available commands.
  tags: [list, commands]
- tool: artisan
  category: basics
  command: 'php artisan help {command}'
  description: Shows a command's arguments and options.
  tags: [help]
  example: 'php artisan help make:model'
- tool: artisan
  category: basics
  command: 'php artisan about'
  description: 'Project overview: version, environment, drivers, cache.'
  tags: [info, project]
- tool: artisan
  category: basics
  command: 'php artisan --version'
  description: Installed Laravel version.
  tags: [version]
- tool: artisan
  category: basics
  command: 'php artisan serve'
  description: Starts the development server (default :8000; change it with --port=8080).
  tags: [server, dev]
  example: 'php artisan serve --port=8080'
- tool: artisan
  category: basics
  command: 'php artisan tinker'
  description: Interactive console (REPL) with the application loaded.
  tags: [repl, console, shell]
- tool: artisan
  category: basics
  command: 'php artisan env'
  description: Shows the current environment (local, production...).
  tags: [environment]
- tool: artisan
  category: basics
  command: 'php artisan key:generate'
  description: Generates APP_KEY in the .env file.
  tags: [key, env]
- tool: artisan
  category: basics
  command: 'php artisan storage:link'
  description: Creates the symbolic link public/storage → storage/app/public.
  tags: [storage, symlink]
- tool: artisan
  category: basics
  command: 'php artisan docs {topic}'
  description: Opens the official documentation on a topic.
  tags: [documentation, help]
  example: 'php artisan docs validation'

# --- generators ---
- tool: artisan
  category: generators
  command: 'php artisan make:model {model} -mfsc'
  description: Model + migration, factory, seeder and controller.
  tags: [make, model, eloquent]
  example: 'php artisan make:model Post -mfsc'
- tool: artisan
  category: generators
  command: 'php artisan make:model {model} -a'
  description: 'Model with everything: migration, factory, seeder, policy, requests and controller.'
  tags: [make, model, eloquent]
  example: 'php artisan make:model Post -a'
- tool: artisan
  category: generators
  command: 'php artisan make:controller {controller} --resource'
  description: Controller with the 7 CRUD methods.
  tags: [make, controller, crud]
  example: 'php artisan make:controller PostController --resource'
- tool: artisan
  category: generators
  command: 'php artisan make:controller {controller} --api'
  description: REST controller without create/edit.
  tags: [make, controller, api, rest]
  example: 'php artisan make:controller Api/PostController --api'
- tool: artisan
  category: generators
  command: 'php artisan make:controller {controller} --invokable'
  description: Single-action controller (__invoke).
  tags: [make, controller, invokable]
  example: 'php artisan make:controller ShowPost --invokable'
- tool: artisan
  category: generators
  command: 'php artisan make:migration create_{table}_table'
  description: New migration to create a table (detects the table from the name).
  tags: [make, migration, table]
  example: 'php artisan make:migration create_posts_table'
- tool: artisan
  category: generators
  command: 'php artisan make:migration add_{column}_to_{table}_table'
  description: Migration to modify an existing table.
  tags: [make, migration, column]
  example: 'php artisan make:migration add_slug_to_posts_table'
- tool: artisan
  category: generators
  command: 'php artisan make:seeder {name}'
  description: Seeder to populate the database with test data.
  tags: [make, seeder, data]
  example: 'php artisan make:seeder UserSeeder'
- tool: artisan
  category: generators
  command: 'php artisan make:factory {name}'
  description: Factory to generate test models.
  tags: [make, factory, data]
  example: 'php artisan make:factory PostFactory'
- tool: artisan
  category: generators
  command: 'php artisan make:request {name}'
  description: Form Request for validation and authorization.
  tags: [make, request, validation]
  example: 'php artisan make:request StorePostRequest'
- tool: artisan
  category: generators
  command: 'php artisan make:middleware {name}'
  description: New HTTP middleware.
  tags: [make, middleware]
  example: 'php artisan make:middleware EnsureIsAdmin'
- tool: artisan
  category: generators
  command: 'php artisan make:policy {name} --model={model}'
  description: Authorization policy tied to a model.
  tags: [make, policy, authorization]
  example: 'php artisan make:policy PostPolicy --model=Post'
- tool: artisan
  category: generators
  command: 'php artisan make:resource {name}'
  description: API Resource to transform JSON responses (--collection for collections).
  tags: [make, resource, api, json]
  example: 'php artisan make:resource PostResource'
- tool: artisan
  category: generators
  command: 'php artisan make:event {name}'
  description: New event.
  tags: [make, event]
- tool: artisan
  category: generators
  command: 'php artisan make:listener {name}'
  description: New event listener.
  tags: [make, listener, event]
- tool: artisan
  category: generators
  command: 'php artisan make:observer {name}'
  description: Model observer.
  tags: [make, observer, model]
- tool: artisan
  category: generators
  command: 'php artisan make:job {name}'
  description: Job for queues.
  tags: [make, job, queue]
  example: 'php artisan make:job ProcessPodcast'
- tool: artisan
  category: generators
  command: 'php artisan make:mail {name}'
  description: New Mailable.
  tags: [make, mail, email]
- tool: artisan
  category: generators
  command: 'php artisan make:notification {name}'
  description: New notification.
  tags: [make, notification]
- tool: artisan
  category: generators
  command: 'php artisan make:command {name}'
  description: Custom Artisan command.
  tags: [make, command, console]
  example: 'php artisan make:command SendReport'
- tool: artisan
  category: generators
  command: 'php artisan make:rule {name}'
  description: Custom validation rule.
  tags: [make, rule, validation]
- tool: artisan
  category: generators
  command: 'php artisan make:cast {name}'
  description: Custom cast for model attributes.
  tags: [make, cast, model]
- tool: artisan
  category: generators
  command: 'php artisan make:enum {name}'
  description: New PHP enum.
  tags: [make, enum]
- tool: artisan
  category: generators
  command: 'php artisan make:component {name}'
  description: Blade component.
  tags: [make, blade, component]
  example: 'php artisan make:component Alert'
- tool: artisan
  category: generators
  command: 'php artisan make:view {name}'
  description: New Blade view.
  tags: [make, blade, view]
- tool: artisan
  category: generators
  command: 'php artisan make:class {name}'
  description: Generic PHP class (Laravel 11+).
  tags: [make, class]
- tool: artisan
  category: generators
  command: 'php artisan make:interface {name}'
  description: PHP interface (Laravel 11+).
  tags: [make, interface]
- tool: artisan
  category: generators
  command: 'php artisan make:trait {name}'
  description: PHP trait (Laravel 11+).
  tags: [make, trait]
- tool: artisan
  category: generators
  command: 'php artisan make:test {name}'
  description: Feature test (--unit for a unit test, --pest for Pest).
  tags: [make, test, phpunit, pest]
  example: 'php artisan make:test PostTest --unit'

# --- database ---
- tool: artisan
  category: database
  command: 'php artisan migrate'
  description: Runs the pending migrations.
  tags: [migration, db]
- tool: artisan
  category: database
  command: 'php artisan migrate --pretend'
  description: Shows the migrations' SQL without running it.
  tags: [migration, sql, dry-run]
- tool: artisan
  category: database
  command: 'php artisan migrate:status'
  description: Status of each migration (run or not).
  tags: [migration, status]
- tool: artisan
  category: database
  command: 'php artisan migrate:rollback'
  description: Rolls back the last batch of migrations (--step=N for N steps).
  tags: [migration, undo, rollback]
  example: 'php artisan migrate:rollback --step=1'
- tool: artisan
  category: database
  command: 'php artisan migrate:reset'
  description: Rolls back all migrations.
  tags: [migration, undo]
- tool: artisan
  category: database
  command: 'php artisan migrate:refresh'
  description: Full rollback and migrate again (--seed to seed).
  tags: [migration, refresh]
- tool: artisan
  category: database
  command: 'php artisan migrate:fresh --seed'
  description: Drops all tables, migrates and seeds. Destructive!
  tags: [migration, seed, destructive]
- tool: artisan
  category: database
  command: 'php artisan migrate --force'
  description: Runs the migrations in production without asking for confirmation.
  tags: [migration, production, deploy]
- tool: artisan
  category: database
  command: 'php artisan db:seed'
  description: Runs all seeders.
  tags: [seed, data]
- tool: artisan
  category: database
  command: 'php artisan db:seed --class={seeder}'
  description: Runs a specific seeder.
  tags: [seed, data]
  example: 'php artisan db:seed --class=UserSeeder'
- tool: artisan
  category: database
  command: 'php artisan db:wipe'
  description: Drops all tables, views and types. Destructive!
  tags: [delete, destructive]
- tool: artisan
  category: database
  command: 'php artisan db:show'
  description: Database information.
  tags: [info, db]
- tool: artisan
  category: database
  command: 'php artisan db:table {table}'
  description: Information about a table.
  tags: [info, table]
  example: 'php artisan db:table users'
- tool: artisan
  category: database
  command: 'php artisan db'
  description: Opens the database CLI client.
  tags: [client, sql, console]
- tool: artisan
  category: database
  command: 'php artisan model:show {model}'
  description: A model's attributes, relations and observers.
  tags: [model, info, eloquent]
  example: 'php artisan model:show Post'
- tool: artisan
  category: database
  command: 'php artisan model:prune'
  description: Deletes records of Prunable models.
  tags: [model, clean, prune]
- tool: artisan
  category: database
  command: 'php artisan schema:dump'
  description: Dumps the schema to SQL (--prune to squash migrations).
  tags: [schema, sql]

# --- cache and optimization ---
- tool: artisan
  category: cache
  command: 'php artisan optimize'
  description: Caches config, routes, events and views (production).
  tags: [optimize, production, deploy]
- tool: artisan
  category: cache
  command: 'php artisan optimize:clear'
  description: Clears all caches at once.
  tags: [clear]
- tool: artisan
  category: cache
  command: 'php artisan config:cache'
  description: Caches the configuration.
  tags: [config, cache]
- tool: artisan
  category: cache
  command: 'php artisan config:clear'
  description: Clears the configuration cache (useful when a .env change doesn't apply).
  tags: [config, clear, env]
- tool: artisan
  category: cache
  command: 'php artisan route:cache'
  description: Caches the routes.
  tags: [routes, cache]
- tool: artisan
  category: cache
  command: 'php artisan route:clear'
  description: Clears the route cache.
  tags: [routes, clear]
- tool: artisan
  category: cache
  command: 'php artisan view:cache'
  description: Precompiles the Blade views.
  tags: [views, blade, cache]
- tool: artisan
  category: cache
  command: 'php artisan view:clear'
  description: Clears the compiled Blade views.
  tags: [views, blade, clear]
- tool: artisan
  category: cache
  command: 'php artisan event:cache'
  description: Caches the event map.
  tags: [events, cache]
- tool: artisan
  category: cache
  command: 'php artisan event:clear'
  description: Clears the cached event map.
  tags: [events, clear]
- tool: artisan
  category: cache
  command: 'php artisan cache:clear'
  description: Empties the application cache (optionally of a specific store).
  tags: [cache, clear]
- tool: artisan
  category: cache
  command: 'php artisan cache:forget {key}'
  description: Removes a specific key from the cache.
  tags: [cache, delete, key]
- tool: artisan
  category: cache
  command: 'php artisan config:show {file}'
  description: Shows the values of a configuration file.
  tags: [config, show]
  example: 'php artisan config:show app'

# --- routes ---
- tool: artisan
  category: routes
  command: 'php artisan route:list'
  description: Lists all registered routes.
  tags: [routes, list]
- tool: artisan
  category: routes
  command: 'php artisan route:list --path={uri}'
  description: Filters the routes by URI.
  tags: [routes, filter]
  example: 'php artisan route:list --path=api'
- tool: artisan
  category: routes
  command: 'php artisan route:list --method={method} --name={name}'
  description: Filters the routes by method or name.
  tags: [routes, filter]
  example: 'php artisan route:list --method=POST --name=posts'
- tool: artisan
  category: routes
  command: 'php artisan route:list -v --except-vendor'
  description: Shows middleware and hides package routes.
  tags: [routes, middleware]

# --- queues ---
- tool: artisan
  category: queues
  command: 'php artisan queue:work'
  description: Processes jobs (restart after every deploy).
  tags: [queue, worker]
- tool: artisan
  category: queues
  command: 'php artisan queue:work --queue={queues}'
  description: Processes jobs from specific queues, in priority order.
  tags: [queue, priority]
  example: 'php artisan queue:work --queue=high,default'
- tool: artisan
  category: queues
  command: 'php artisan queue:work --tries=3 --timeout=60'
  description: Processes jobs with retries and a maximum time per job.
  tags: [queue, retries]
- tool: artisan
  category: queues
  command: 'php artisan queue:listen'
  description: Like queue:work, but reloads the code on every job (development).
  tags: [queue, dev]
- tool: artisan
  category: queues
  command: 'php artisan queue:restart'
  description: Gracefully restarts the workers.
  tags: [queue, restart, deploy]
- tool: artisan
  category: queues
  command: 'php artisan queue:failed'
  description: Lists the failed jobs.
  tags: [queue, failed]
- tool: artisan
  category: queues
  command: 'php artisan queue:retry {id}'
  description: Retries a failed job (or all of them with all).
  tags: [queue, failed, retry]
  example: 'php artisan queue:retry all'
- tool: artisan
  category: queues
  command: 'php artisan queue:forget {id}'
  description: Deletes a failed job.
  tags: [queue, failed, delete]
- tool: artisan
  category: queues
  command: 'php artisan queue:flush'
  description: Deletes all failed jobs.
  tags: [queue, failed, delete]
- tool: artisan
  category: queues
  command: 'php artisan queue:clear'
  description: Empties a queue (optionally of a specific connection).
  tags: [queue, empty]
- tool: artisan
  category: queues
  command: 'php artisan queue:monitor {connection}:{queue} --max={limit}'
  description: Warns when the queue exceeds a size.
  tags: [queue, monitor]
  example: 'php artisan queue:monitor redis:default --max=100'

# --- scheduled tasks ---
- tool: artisan
  category: scheduling
  command: 'php artisan schedule:list'
  description: Lists the scheduled tasks and their next run.
  tags: [scheduler, cron]
- tool: artisan
  category: scheduling
  command: 'php artisan schedule:run'
  description: Runs the due tasks (call it from cron every minute).
  tags: [scheduler, cron]
- tool: artisan
  category: scheduling
  command: 'php artisan schedule:work'
  description: Runs the scheduler in the foreground (development).
  tags: [scheduler, dev]
- tool: artisan
  category: scheduling
  command: 'php artisan schedule:test'
  description: Manually runs a scheduled task.
  tags: [scheduler, test]

# --- maintenance and packages ---
- tool: artisan
  category: maintenance
  command: 'php artisan down --secret={token}'
  description: Maintenance mode; visiting /token lets you bypass it.
  tags: [maintenance, down]
- tool: artisan
  category: maintenance
  command: 'php artisan down --render="errors::503" --retry=60'
  description: Maintenance mode with a custom view and a Retry-After header.
  tags: [maintenance, down]
- tool: artisan
  category: maintenance
  command: 'php artisan up'
  description: Leaves maintenance mode.
  tags: [maintenance, up]
- tool: artisan
  category: maintenance
  command: 'php artisan vendor:publish --tag={tag}'
  description: Publishes package config, views or assets (also --provider=...).
  tags: [packages, publish, vendor]
- tool: artisan
  category: maintenance
  command: 'php artisan install:api'
  description: Installs Sanctum and routes/api.php (Laravel 11+).
  tags: [api, sanctum, install]
- tool: artisan
  category: maintenance
  command: 'php artisan install:broadcasting'
  description: Sets up broadcasting / Reverb (Laravel 11+).
  tags: [broadcasting, reverb, websockets]
- tool: artisan
  category: maintenance
  command: 'php artisan config:publish {name}'
  description: Publishes hidden config files (Laravel 11+).
  tags: [config, publish]
- tool: artisan
  category: maintenance
  command: 'php artisan lang:publish'
  description: Publishes the language files.
  tags: [language, translations]
- tool: artisan
  category: maintenance
  command: 'php artisan stub:publish'
  description: 'Publishes the stubs to customize the make: commands.'
  tags: [stubs, templates]
- tool: artisan
  category: maintenance
  command: 'php artisan package:discover'
  description: Rebuilds the package manifest.
  tags: [packages]

# --- testing and debugging ---
- tool: artisan
  category: testing
  command: 'php artisan test'
  description: Runs the test suite (PHPUnit or Pest).
  tags: [test, phpunit, pest]
- tool: artisan
  category: testing
  command: 'php artisan test --filter={name}'
  description: Runs only the matching tests.
  tags: [test, filter]
  example: 'php artisan test --filter=PostTest'
- tool: artisan
  category: testing
  command: 'php artisan test --parallel'
  description: Runs the tests in parallel.
  tags: [test, parallel]
- tool: artisan
  category: testing
  command: 'php artisan test --coverage'
  description: Runs the tests with a coverage report.
  tags: [test, coverage]
- tool: artisan
  category: testing
  command: 'php artisan pail'
  description: Follows the logs in real time (Laravel 11+; --filter=... to filter).
  tags: [logs, debug, tail]
