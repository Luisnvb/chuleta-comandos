# Source: pdfs/git.pdf (the "key concepts" section is intentionally omitted)

# --- configuration ---
- tool: git
  category: configuration
  command: 'git config --global user.name "{name}"'
  description: Name that will appear on your commits.
  tags: [config, user, setup]
  example: 'git config --global user.name "Your Name"'
- tool: git
  category: configuration
  command: 'git config --global user.email "{email}"'
  description: Email associated with your commits.
  tags: [config, email, setup]
- tool: git
  category: configuration
  command: 'git config --global init.defaultBranch main'
  description: Uses main as the initial branch in new repos.
  tags: [config, branch, setup]
- tool: git
  category: configuration
  command: 'git config --global core.editor "code --wait"'
  description: Editor for commit messages (VS Code here; also nano, vim).
  tags: [config, editor, vscode]
- tool: git
  category: configuration
  command: 'git config --global pull.rebase false'
  description: 'Pull behaviour: merge (false) or rebase (true).'
  tags: [config, pull, rebase]
- tool: git
  category: configuration
  command: 'git config --list --show-origin'
  description: Shows all configuration and which file each value comes from.
  tags: [config, list]

# --- create or get a repository ---
- tool: git
  category: repository
  command: 'git init'
  description: Turns the current folder into a Git repository.
  tags: [create, new, repo]
- tool: git
  category: repository
  command: 'git clone {url}'
  description: Downloads a complete remote repository.
  tags: [clone, download, repo]
  example: 'git clone https://github.com/user/repo.git'
- tool: git
  category: repository
  command: 'git clone {url} {folder}'
  description: Clones into a folder with a different name.
  tags: [clone, repo]
- tool: git
  category: repository
  command: 'git clone --depth 1 {url}'
  description: 'Shallow clone: only the latest commit (faster).'
  tags: [clone, shallow]

# --- basic workflow ---
- tool: git
  category: basics
  command: 'git status'
  description: 'Status: what has changed, what is staged and what is not.'
  tags: [status, changes]
- tool: git
  category: basics
  command: 'git status -s'
  description: Short status (M = modified, A = added, ?? = untracked).
  tags: [status, short]
- tool: git
  category: basics
  command: 'git add {file}'
  description: Stages a file for the next commit.
  tags: [staging, stage]
- tool: git
  category: basics
  command: 'git add .'
  description: Stages all changes in the current folder.
  tags: [staging, stage, all]
- tool: git
  category: basics
  command: 'git add -p'
  description: Stages changes hunk by hunk, choosing each one.
  tags: [staging, patch, interactive]
- tool: git
  category: basics
  command: 'git commit -m "{message}"'
  description: Creates a commit with the staged changes.
  tags: [commit, save]
  example: 'git commit -m "Fix email validation"'
- tool: git
  category: basics
  command: 'git commit -am "{message}"'
  description: Stages and commits already tracked files (new files are not included).
  tags: [commit, save]
- tool: git
  category: basics
  command: 'git commit --amend'
  description: Modifies the last commit (message or content). Only if you haven't pushed it.
  tags: [commit, fix, amend]
- tool: git
  category: basics
  command: 'git rm {file}'
  description: Deletes the file and records the deletion.
  tags: [delete, remove]
- tool: git
  category: basics
  command: 'git rm --cached {file}'
  description: Stops tracking a file without deleting it from disk.
  tags: [untrack, gitignore]
- tool: git
  category: basics
  command: 'git mv {source} {destination}'
  description: Renames or moves a file.
  tags: [move, rename]

# --- history and diffs ---
- tool: git
  category: history
  command: 'git log'
  description: Full commit history.
  tags: [history, log]
- tool: git
  category: history
  command: 'git log --oneline --graph --all'
  description: Compact history with a graph of all branches.
  tags: [history, graph, log]
- tool: git
  category: history
  command: 'git log -n 5'
  description: Only the last 5 commits.
  tags: [history, log]
- tool: git
  category: history
  command: 'git log -p {file}'
  description: History of a file with the changes of each commit.
  tags: [history, file, log]
- tool: git
  category: history
  command: 'git log --author="{author}" --since="{date}"'
  description: Filters the history by author and date.
  tags: [history, filter, log]
  example: 'git log --author="Ana" --since="2 weeks ago"'
- tool: git
  category: history
  command: 'git log -S "{text}"'
  description: Commits that added or removed that text.
  tags: [history, search, pickaxe]
- tool: git
  category: history
  command: 'git diff'
  description: Unstaged changes (working tree vs. staging).
  tags: [diff, changes]
- tool: git
  category: history
  command: 'git diff --staged'
  description: Staged changes (staging vs. last commit).
  tags: [diff, staging]
- tool: git
  category: history
  command: 'git diff {branch_a}..{branch_b}'
  description: Differences between two branches.
  tags: [diff, branches, compare]
  example: 'git diff main..other-branch'
- tool: git
  category: history
  command: 'git show {hash}'
  description: Details of a specific commit.
  tags: [commit, details]
- tool: git
  category: history
  command: 'git blame {file}'
  description: Who changed each line and in which commit.
  tags: [author, lines]

# --- branches ---
- tool: git
  category: branches
  command: 'git branch'
  description: Lists local branches (* marks the current one).
  tags: [branch, list]
- tool: git
  category: branches
  command: 'git branch -a'
  description: Also lists remote branches.
  tags: [branch, list, remote]
- tool: git
  category: branches
  command: 'git branch -vv'
  description: Branches with their upstream branch and status.
  tags: [branch, upstream]
- tool: git
  category: branches
  command: 'git switch {branch}'
  description: Switches to another branch (like git checkout).
  tags: [branch, switch, checkout]
- tool: git
  category: branches
  command: 'git switch -c {branch}'
  description: Creates a new branch and switches to it.
  tags: [branch, create]
  example: 'git switch -c feature/login'
- tool: git
  category: branches
  command: 'git switch -'
  description: Goes back to the previous branch.
  tags: [branch, previous]
- tool: git
  category: branches
  command: 'git branch -m {new_name}'
  description: Renames the current branch.
  tags: [branch, rename]
- tool: git
  category: branches
  command: 'git branch -d {branch}'
  description: Deletes an already merged branch.
  tags: [branch, delete]
- tool: git
  category: branches
  command: 'git branch -D {branch}'
  description: Force-deletes a branch even if it isn't merged.
  tags: [branch, delete, force]
- tool: git
  category: branches
  command: 'git push origin --delete {branch}'
  description: Deletes the branch on the remote.
  tags: [branch, delete, remote]

# --- merge and integrate ---
- tool: git
  category: merging
  command: 'git merge {branch}'
  description: Merges a branch into the current branch.
  tags: [merge]
- tool: git
  category: merging
  command: 'git merge --no-ff {branch}'
  description: Forces a merge commit even if a fast-forward were possible.
  tags: [merge, no-fast-forward]
- tool: git
  category: merging
  command: 'git merge --abort'
  description: Cancels a merge with conflicts and returns to the previous state.
  tags: [merge, cancel, conflicts]
- tool: git
  category: merging
  command: 'git rebase {branch}'
  description: Replays your commits on top of another branch (linear history).
  tags: [rebase]
  example: 'git rebase main'
- tool: git
  category: merging
  command: 'git rebase -i HEAD~3'
  description: 'Interactive rebase: reorder, squash or edit the last 3 commits.'
  tags: [rebase, interactive, squash]
- tool: git
  category: merging
  command: 'git rebase --continue'
  description: Continues the rebase after resolving a conflict.
  tags: [rebase, conflicts]
- tool: git
  category: merging
  command: 'git rebase --abort'
  description: Cancels the rebase.
  tags: [rebase, cancel]
- tool: git
  category: merging
  command: 'git cherry-pick {hash}'
  description: Copies a specific commit onto the current branch.
  tags: [cherry-pick, copy, commit]

# --- remotes ---
- tool: git
  category: remotes
  command: 'git remote -v'
  description: Lists the configured remotes and their URLs.
  tags: [remote, list]
- tool: git
  category: remotes
  command: 'git remote add origin {url}'
  description: Adds a remote to a repo created with git init.
  tags: [remote, add, github]
- tool: git
  category: remotes
  command: 'git remote set-url origin {url}'
  description: Changes the remote URL.
  tags: [remote, url]
- tool: git
  category: remotes
  command: 'git fetch'
  description: Downloads changes from the remote without touching your files.
  tags: [fetch, download]
- tool: git
  category: remotes
  command: 'git fetch --prune'
  description: Downloads changes and cleans up references to deleted remote branches.
  tags: [fetch, clean, prune]
- tool: git
  category: remotes
  command: 'git pull'
  description: Downloads and integrates remote changes into your current branch.
  tags: [pull, update]
- tool: git
  category: remotes
  command: 'git pull --rebase'
  description: Downloads and rebases instead of merging.
  tags: [pull, rebase]
- tool: git
  category: remotes
  command: 'git push'
  description: Uploads your commits to the upstream branch.
  tags: [push, upload]
- tool: git
  category: remotes
  command: 'git push -u origin {branch}'
  description: 'First push of a branch: creates it on the remote and sets it as upstream.'
  tags: [push, upload, upstream]
  example: 'git push -u origin feature/login'
- tool: git
  category: remotes
  command: 'git push --force-with-lease'
  description: Overwrites the remote after a rebase, but fails if someone else pushed changes. Safe alternative to --force.
  tags: [push, force, rebase]
- tool: git
  category: remotes
  command: 'git push --tags'
  description: Pushes local tags.
  tags: [push, tags]

# --- undo changes ---
- tool: git
  category: undo
  command: 'git restore {file}'
  description: Discards unstaged changes to the file. Irreversible.
  tags: [discard, undo]
- tool: git
  category: undo
  command: 'git restore --staged {file}'
  description: Unstages the file; keeps the changes.
  tags: [unstage, undo]
- tool: git
  category: undo
  command: 'git restore --source={hash} {file}'
  description: Restores the file as it was in that commit.
  tags: [restore, recover, undo]
- tool: git
  category: undo
  command: 'git reset --soft HEAD~1'
  description: Undoes the last commit; the changes stay staged.
  tags: [reset, undo, commit]
- tool: git
  category: undo
  command: 'git reset HEAD~1'
  description: Undoes the last commit; the changes stay unstaged.
  tags: [reset, undo, commit]
- tool: git
  category: undo
  command: 'git reset --hard HEAD~1'
  description: Undoes the last commit and deletes its changes.
  tags: [reset, undo, destructive]
- tool: git
  category: undo
  command: 'git reset --hard origin/main'
  description: Makes your branch identical to the remote, discarding everything local.
  tags: [reset, remote, destructive]
- tool: git
  category: undo
  command: 'git revert {hash}'
  description: Creates a new commit that reverses another one. Safe for already pushed commits.
  tags: [revert, undo]
- tool: git
  category: undo
  command: 'git clean -n'
  description: Shows which untracked files would be deleted (dry run).
  tags: [clean, untracked, dry-run]
- tool: git
  category: undo
  command: 'git clean -fd'
  description: Deletes untracked files and folders.
  tags: [clean, untracked, destructive]

# --- stash ---
- tool: git
  category: stash
  command: 'git stash'
  description: Sets aside uncommitted changes and leaves the working directory clean.
  tags: [stash, save, shelve]
- tool: git
  category: stash
  command: 'git stash push -m "{description}"'
  description: Sets aside the changes with a name to identify them.
  tags: [stash, save]
- tool: git
  category: stash
  command: 'git stash -u'
  description: Sets aside the changes including untracked files.
  tags: [stash, untracked]
- tool: git
  category: stash
  command: 'git stash list'
  description: Lists the saved stashes.
  tags: [stash, list]
- tool: git
  category: stash
  command: 'git stash pop'
  description: Restores the latest stash and removes it from the list.
  tags: [stash, restore]
- tool: git
  category: stash
  command: 'git stash apply stash@{1}'
  description: Applies a specific stash without deleting it.
  tags: [stash, apply]
- tool: git
  category: stash
  command: 'git stash drop stash@{1}'
  description: Deletes a stash.
  tags: [stash, delete]

# --- tags ---
- tool: git
  category: tags
  command: 'git tag'
  description: Lists the tags.
  tags: [tag, version, list]
- tool: git
  category: tags
  command: 'git tag -a {version} -m "{message}"'
  description: Creates an annotated tag on the current commit.
  tags: [tag, version, create]
  example: 'git tag -a v1.0 -m "Version 1.0"'
- tool: git
  category: tags
  command: 'git tag -a {version} {hash}'
  description: Tags an earlier commit.
  tags: [tag, version]
- tool: git
  category: tags
  command: 'git push origin {version}'
  description: Pushes a specific tag.
  tags: [tag, push]
- tool: git
  category: tags
  command: 'git tag -d {version}'
  description: Deletes a local tag.
  tags: [tag, delete]
- tool: git
  category: tags
  command: 'git push origin --delete {version}'
  description: Deletes the tag on the remote.
  tags: [tag, delete, remote]

# --- advanced tools ---
- tool: git
  category: advanced
  command: 'git reflog'
  description: Log of every HEAD movement. Useful to recover "lost" commits.
  tags: [reflog, recover]
- tool: git
  category: advanced
  command: 'git reset --hard {hash}'
  description: Goes back to an earlier state (for example, one found in the reflog).
  tags: [reflog, recover, reset]
- tool: git
  category: advanced
  command: 'git bisect start'
  description: Starts a binary search for the commit that introduced a bug.
  tags: [bisect, bug, debug]
- tool: git
  category: advanced
  command: 'git bisect bad'
  description: Marks the current commit as bad during a bisect.
  tags: [bisect, bug]
- tool: git
  category: advanced
  command: 'git bisect good {hash}'
  description: Marks a commit as good; Git keeps narrowing it down.
  tags: [bisect, bug]
- tool: git
  category: advanced
  command: 'git bisect reset'
  description: Ends the bisect and returns to where you were.
  tags: [bisect]
- tool: git
  category: advanced
  command: 'git worktree add {path} {branch}'
  description: Checks out another branch in a separate folder, side by side.
  tags: [worktree, parallel]
  example: 'git worktree add ../folder feature/login'
- tool: git
  category: advanced
  command: 'git grep "{text}"'
  description: Searches for text in tracked files.
  tags: [search, grep]
- tool: git
  category: advanced
  command: 'git shortlog -sn'
  description: Number of commits per author.
  tags: [authors, stats]
- tool: git
  category: advanced
  command: 'git check-ignore -v {file}'
  description: Explains which .gitignore rule ignores a file.
  tags: [gitignore, ignore]

# --- aliases ---
- tool: git
  category: aliases
  command: 'git config --global alias.st status'
  description: Creates the alias git st for git status.
  tags: [alias, shortcut]
- tool: git
  category: aliases
  command: 'git config --global alias.co checkout'
  description: Creates the alias git co for git checkout.
  tags: [alias, shortcut]
- tool: git
  category: aliases
  command: 'git config --global alias.sw switch'
  description: Creates the alias git sw for git switch.
  tags: [alias, shortcut]
- tool: git
  category: aliases
  command: 'git config --global alias.lg "log --oneline --graph --all --decorate"'
  description: Creates the alias git lg for a compact history with a graph.
  tags: [alias, shortcut, log]
- tool: git
  category: aliases
  command: 'git config --global alias.last "log -1 HEAD --stat"'
  description: Creates the alias git last to see the last commit with stats.
  tags: [alias, shortcut, log]
- tool: git
  category: aliases
  command: 'git config --global alias.unstage "restore --staged"'
  description: Creates the alias git unstage to unstage files.
  tags: [alias, shortcut, unstage]

# --- help ---
- tool: git
  category: help
  command: 'git {command} --help'
  description: Opens the official documentation of a command.
  tags: [help, docs]
