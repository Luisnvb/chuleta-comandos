# PowerShell (Windows PowerShell 5.1 and PowerShell 7). Not from a PDF: written for this project.

# --- navigation and files ---
- tool: powershell
  category: navigation and files
  command: 'Get-Location'
  description: Shows the current directory (alias pwd).
  tags: [directory, pwd, path]
- tool: powershell
  category: navigation and files
  command: 'Set-Location {path}'
  description: Changes directory, drive included (alias cd).
  tags: [directory, cd]
  example: 'Set-Location D:\projects'
- tool: powershell
  category: navigation and files
  command: 'Get-ChildItem -Force'
  description: Lists files including hidden ones (alias ls, dir, gci).
  tags: [list, ls, hidden]
- tool: powershell
  category: navigation and files
  command: 'Get-ChildItem -Recurse -Filter {pattern}'
  description: Finds files by name in subfolders.
  tags: [search, find, recursive]
  example: 'Get-ChildItem -Recurse -Filter *.log'
- tool: powershell
  category: navigation and files
  command: 'New-Item -ItemType Directory -Force {path}'
  description: Creates a directory with its intermediate ones (like mkdir -p).
  tags: [create, folder, mkdir]
- tool: powershell
  category: navigation and files
  command: 'New-Item -ItemType File {file}'
  description: Creates an empty file.
  tags: [create, file, touch]
- tool: powershell
  category: navigation and files
  command: 'Copy-Item {source} {destination} -Recurse'
  description: Copies files or folders (alias cp).
  tags: [copy]
- tool: powershell
  category: navigation and files
  command: 'Move-Item {source} {destination}'
  description: Moves files or folders (alias mv).
  tags: [move]
- tool: powershell
  category: navigation and files
  command: 'Rename-Item {file} {new_name}'
  description: Renames a file or folder.
  tags: [rename]
- tool: powershell
  category: navigation and files
  command: 'Remove-Item {path} -Recurse -Force'
  description: Deletes files or folders without recycle bin or confirmation (alias rm).
  tags: [delete, remove, rm]
  example: 'Remove-Item node_modules -Recurse -Force'
- tool: powershell
  category: navigation and files
  command: 'Test-Path {path}'
  description: Tells whether a file or folder exists (True/False).
  tags: [exists, check]
- tool: powershell
  category: navigation and files
  command: 'New-Item -ItemType SymbolicLink -Path {link} -Target {target}'
  description: Creates a symbolic link (needs admin or developer mode).
  tags: [symlink, link]
- tool: powershell
  category: navigation and files
  command: 'Invoke-Item .'
  description: Opens the current folder in File Explorer (alias ii).
  tags: [explorer, open]

# --- view and edit content ---
- tool: powershell
  category: view and edit
  command: 'Get-Content {file}'
  description: Prints the contents of a file (alias cat, gc).
  tags: [read, cat, show]
- tool: powershell
  category: view and edit
  command: 'Get-Content {file} -TotalCount 20'
  description: First lines of a file (like head).
  tags: [first, head]
- tool: powershell
  category: view and edit
  command: 'Get-Content {file} -Tail 20'
  description: Last lines of a file (like tail).
  tags: [last, tail]
- tool: powershell
  category: view and edit
  command: 'Get-Content {file} -Wait -Tail 20'
  description: Follows a file in real time (like tail -f).
  tags: [logs, follow, tail]
- tool: powershell
  category: view and edit
  command: 'Set-Content {file} "{text}" -Encoding utf8'
  description: Writes text to a file, overwriting it.
  tags: [write, overwrite]
- tool: powershell
  category: view and edit
  command: 'Add-Content {file} "{text}"'
  description: Appends text to the end of a file.
  tags: [add, append]
- tool: powershell
  category: view and edit
  command: 'Compare-Object (Get-Content {file_a}) (Get-Content {file_b})'
  description: Compares two files line by line.
  tags: [compare, diff]
- tool: powershell
  category: view and edit
  command: '(Get-Content {file}).Count'
  description: Counts the lines of a file.
  tags: [count, lines, wc]

# --- search and filter ---
- tool: powershell
  category: search and filter
  command: 'Select-String -Path {pattern} -Pattern "{text}"'
  description: Searches for text in files, with line numbers (like grep).
  tags: [search, grep, text]
  example: 'Select-String -Path *.js -Pattern "TODO"'
- tool: powershell
  category: search and filter
  command: 'Get-ChildItem -Recurse -File | Select-String "{text}"'
  description: Searches for text in all files in subfolders.
  tags: [search, grep, recursive]
- tool: powershell
  category: search and filter
  command: '{command} | Where-Object { $_.{property} -like "*{text}*" }'
  description: Filters objects by the value of a property (alias where, ?).
  tags: [filter, where]
  example: 'Get-Process | Where-Object { $_.Name -like "*node*" }'
- tool: powershell
  category: search and filter
  command: '{command} | Select-Object -First 10'
  description: Keeps the first items (or picks properties with -Property).
  tags: [select, head]
- tool: powershell
  category: search and filter
  command: '{command} | Sort-Object {property} -Descending'
  description: Sorts objects by a property.
  tags: [sort]
  example: 'Get-ChildItem | Sort-Object Length -Descending'
- tool: powershell
  category: search and filter
  command: '{command} | Group-Object {property}'
  description: Groups and counts objects by a property.
  tags: [group, count]
- tool: powershell
  category: search and filter
  command: '(Get-Command {command}).Source'
  description: Path of a command's executable (like which).
  tags: [path, executable, which]
- tool: powershell
  category: search and filter
  command: 'Get-Command *{text}*'
  description: Finds cmdlets and commands by name.
  tags: [search, cmdlets]
- tool: powershell
  category: search and filter
  command: '{command} | Get-Member'
  description: Shows the properties and methods of the output objects.
  tags: [properties, methods, objects]

# --- processes and system ---
- tool: powershell
  category: processes and system
  command: 'Get-Process'
  description: Lists the running processes (alias ps).
  tags: [processes, ps]
- tool: powershell
  category: processes and system
  command: 'Stop-Process -Id {pid} -Force'
  description: Force-closes a process by its PID.
  tags: [kill, terminate]
- tool: powershell
  category: processes and system
  command: 'Stop-Process -Name {name} -Force'
  description: Force-closes all processes with that name.
  tags: [kill, terminate]
  example: 'Stop-Process -Name node -Force'
- tool: powershell
  category: processes and system
  command: 'Start-Process {program} -Verb RunAs'
  description: Opens a program as administrator.
  tags: [admin, run, sudo]
  example: 'Start-Process powershell -Verb RunAs'
- tool: powershell
  category: processes and system
  command: 'Get-Service {name}'
  description: Status of a Windows service.
  tags: [service, status]
- tool: powershell
  category: processes and system
  command: 'Restart-Service {name}'
  description: Restarts a service (also Start-Service, Stop-Service).
  tags: [service, restart]
- tool: powershell
  category: processes and system
  command: '$PSVersionTable'
  description: PowerShell version.
  tags: [version]
- tool: powershell
  category: processes and system
  command: 'Get-ComputerInfo'
  description: Detailed system information.
  tags: [system, info]
- tool: powershell
  category: processes and system
  command: 'Get-PSDrive -PSProvider FileSystem'
  description: Drives with used and free space.
  tags: [disk, space, df]

# --- environment variables and profile ---
- tool: powershell
  category: environment variables
  command: 'Get-ChildItem env:'
  description: Lists all environment variables.
  tags: [env, variables, list]
- tool: powershell
  category: environment variables
  command: '$env:{variable}'
  description: Shows the value of an environment variable.
  tags: [env, variables, show]
  example: '$env:PATH'
- tool: powershell
  category: environment variables
  command: '$env:{variable} = "{value}"'
  description: Sets a variable for the current session only.
  tags: [env, variables, set]
  example: '$env:NODE_ENV = "production"'
- tool: powershell
  category: environment variables
  command: '[Environment]::SetEnvironmentVariable("{variable}", "{value}", "User")'
  description: Sets a user variable permanently.
  tags: [env, variables, permanent]
- tool: powershell
  category: environment variables
  command: "$env:Path -split ';'"
  description: Shows each PATH entry on its own line.
  tags: [path, env]
- tool: powershell
  category: environment variables
  command: 'notepad $PROFILE'
  description: Edits your profile (runs when PowerShell opens; ideal for aliases and functions).
  tags: [profile, configuration]
- tool: powershell
  category: environment variables
  command: 'Set-Alias {alias} {command}'
  description: Creates an alias for a command (save it in $PROFILE).
  tags: [alias, shortcut]
  example: 'Set-Alias g git'
- tool: powershell
  category: environment variables
  command: 'Set-ExecutionPolicy RemoteSigned -Scope CurrentUser'
  description: Allows running local scripts (.ps1) for your user.
  tags: [scripts, permissions, policy]
- tool: powershell
  category: environment variables
  command: '$LASTEXITCODE'
  description: Exit code of the last external program (0 = success).
  tags: [exit code, error]

# --- network ---
- tool: powershell
  category: network
  command: 'Test-NetConnection {host} -Port {port}'
  description: Checks whether a host responds on a specific port.
  tags: [connectivity, port, ping]
  example: 'Test-NetConnection github.com -Port 443'
- tool: powershell
  category: network
  command: 'Get-NetIPAddress -AddressFamily IPv4'
  description: IPv4 addresses of each interface.
  tags: [ip, network]
- tool: powershell
  category: network
  command: 'Resolve-DnsName {domain}'
  description: Looks up a domain's DNS records.
  tags: [dns, domain, nslookup]
- tool: powershell
  category: network
  command: 'Get-NetTCPConnection -LocalPort {port}'
  description: Finds out which process (OwningProcess) is using a port.
  tags: [ports, pid]
  example: 'Get-NetTCPConnection -LocalPort 8000'
- tool: powershell
  category: network
  command: 'Invoke-WebRequest {url} -OutFile {file}'
  description: Downloads a file (alias iwr).
  tags: [download, wget]
- tool: powershell
  category: network
  command: 'Invoke-RestMethod {url}'
  description: Calls an API and turns the JSON response into objects (alias irm).
  tags: [api, http, json, rest]
  example: 'Invoke-RestMethod https://api.github.com/users/octocat'

# --- compression ---
- tool: powershell
  category: compression
  command: 'Compress-Archive -Path {source} -DestinationPath {archive}.zip'
  description: Compresses files or folders into a zip.
  tags: [compress, zip]
  example: 'Compress-Archive -Path dist -DestinationPath dist.zip'
- tool: powershell
  category: compression
  command: 'Expand-Archive {archive}.zip -DestinationPath {destination}'
  description: Extracts a zip.
  tags: [decompress, zip, extract]

# --- shell and clipboard ---
- tool: powershell
  category: shell
  command: '{command} | Set-Clipboard'
  description: Copies a command's output to the clipboard.
  tags: [clipboard, copy]
- tool: powershell
  category: shell
  command: 'Get-Clipboard'
  description: Shows the clipboard contents.
  tags: [clipboard, paste]
- tool: powershell
  category: shell
  command: '{command} | Out-File {file} -Encoding utf8'
  description: Sends the output to a file (> also works; -Append to append).
  tags: [redirect, output]
- tool: powershell
  category: shell
  command: '{command1}; if ($?) { {command2} }'
  description: Runs the second command only if the first one succeeded (in PowerShell 7, && is enough).
  tags: [chain, and]
- tool: powershell
  category: shell
  command: 'Get-History'
  description: The session's command history (alias h).
  tags: [history]
- tool: powershell
  category: shell
  command: 'Clear-Host'
  description: Clears the screen (alias cls, clear).
  tags: [clear]
- tool: powershell
  category: shell
  command: 'Get-Help {command} -Examples'
  description: A cmdlet's help with usage examples.
  tags: [help, examples]
  example: 'Get-Help Get-ChildItem -Examples'

# --- keyboard shortcuts ---
- tool: powershell
  category: shortcuts
  command: 'Ctrl+R'
  description: Searches the command history.
  tags: [keyboard, history, shortcut]
- tool: powershell
  category: shortcuts
  command: 'Ctrl+Space'
  description: Shows all autocomplete options.
  tags: [keyboard, autocomplete, shortcut]
- tool: powershell
  category: shortcuts
  command: 'Tab'
  description: Autocompletes cmdlets, parameters and paths.
  tags: [keyboard, autocomplete, shortcut]
- tool: powershell
  category: shortcuts
  command: 'Ctrl+C'
  description: Interrupts the running command.
  tags: [keyboard, interrupt, shortcut]
