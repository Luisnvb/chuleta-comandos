# npm (Node.js package manager). Not from a PDF: written for this project.

# --- project ---
- tool: npm
  category: project
  command: 'npm init -y'
  description: Creates a package.json with default values.
  tags: [create, init, package.json]
- tool: npm
  category: project
  command: 'npm create {template}@latest {folder}'
  description: Creates a project from a template (create-*).
  tags: [create, scaffold, template]
  example: 'npm create vite@latest my-app'
- tool: npm
  category: project
  command: 'npm pkg set {key}="{value}"'
  description: Changes a package.json field from the terminal.
  tags: [package.json, edit]
  example: 'npm pkg set scripts.lint="eslint ."'
- tool: npm
  category: project
  command: 'npm version {type}'
  description: Bumps the version (patch, minor, major) and creates a git commit and tag.
  tags: [version, semver, release]
  example: 'npm version patch'

# --- dependencies ---
- tool: npm
  category: dependencies
  command: 'npm install'
  description: Installs all dependencies from package.json (alias npm i).
  tags: [install]
- tool: npm
  category: dependencies
  command: 'npm ci'
  description: Clean, exact install from package-lock.json (ideal for CI).
  tags: [install, ci, lock]
- tool: npm
  category: dependencies
  command: 'npm install {package}'
  description: Installs a package as a dependency.
  tags: [install, add]
  example: 'npm install fuse.js'
- tool: npm
  category: dependencies
  command: 'npm install -D {package}'
  description: Installs a package as a dev dependency.
  tags: [install, dev, devDependencies]
  example: 'npm install -D vite'
- tool: npm
  category: dependencies
  command: 'npm install {package}@{version}'
  description: Installs a specific version of a package.
  tags: [install, version]
  example: 'npm install react@18.3.1'
- tool: npm
  category: dependencies
  command: 'npm install -g {package}'
  description: Installs a package globally.
  tags: [install, global]
- tool: npm
  category: dependencies
  command: 'npm uninstall {package}'
  description: Uninstalls a package and removes it from package.json.
  tags: [uninstall, remove]
- tool: npm
  category: dependencies
  command: 'npm update'
  description: Updates packages within the ranges in package.json.
  tags: [update, upgrade]
- tool: npm
  category: dependencies
  command: 'npm outdated'
  description: Lists packages with newer versions available.
  tags: [outdated, versions]
- tool: npm
  category: dependencies
  command: 'npm ls --depth=0'
  description: Lists the installed direct dependencies.
  tags: [list, dependencies]
- tool: npm
  category: dependencies
  command: 'npm ls -g --depth=0'
  description: Lists the installed global packages.
  tags: [list, global]
- tool: npm
  category: dependencies
  command: 'npm explain {package}'
  description: Explains why a package is installed (alias npm why).
  tags: [dependencies, why]
- tool: npm
  category: dependencies
  command: 'npm dedupe'
  description: Reduces duplicates in the dependency tree.
  tags: [duplicates, optimize]
- tool: npm
  category: dependencies
  command: 'npm prune'
  description: Removes packages that are not in package.json.
  tags: [clean, extraneous]

# --- scripts ---
- tool: npm
  category: scripts
  command: 'npm run'
  description: Lists the scripts available in package.json.
  tags: [scripts, list]
- tool: npm
  category: scripts
  command: 'npm run {script}'
  description: Runs a script from package.json.
  tags: [scripts, run]
  example: 'npm run build'
- tool: npm
  category: scripts
  command: 'npm run {script} -- {arguments}'
  description: Runs a script passing extra arguments to it.
  tags: [scripts, arguments]
  example: 'npm run dev -- --port 3000'
- tool: npm
  category: scripts
  command: 'npm start'
  description: Runs the start script.
  tags: [scripts, start]
- tool: npm
  category: scripts
  command: 'npm test'
  description: Runs the test script (alias npm t).
  tags: [scripts, test]
- tool: npm
  category: scripts
  command: 'npx {package}'
  description: Runs a package binary without installing it globally.
  tags: [npx, run, binary]
  example: 'npx eslint .'

# --- info ---
- tool: npm
  category: info
  command: 'npm view {package} version'
  description: Latest published version of a package.
  tags: [version, info]
- tool: npm
  category: info
  command: 'npm view {package} versions'
  description: All published versions of a package.
  tags: [versions, info]
- tool: npm
  category: info
  command: 'npm docs {package}'
  description: Opens a package's documentation in the browser.
  tags: [documentation, docs]
- tool: npm
  category: info
  command: 'npm repo {package}'
  description: Opens a package's repository in the browser.
  tags: [repository, github]
- tool: npm
  category: info
  command: 'npm -v'
  description: Installed npm version.
  tags: [version]

# --- security and maintenance ---
- tool: npm
  category: maintenance
  command: 'npm audit'
  description: Looks for known vulnerabilities in the dependencies.
  tags: [security, vulnerabilities, audit]
- tool: npm
  category: maintenance
  command: 'npm audit fix'
  description: Updates dependencies to fix vulnerabilities without breaking changes.
  tags: [security, fix, audit]
- tool: npm
  category: maintenance
  command: 'npm cache clean --force'
  description: Empties the npm cache.
  tags: [cache, clean]
- tool: npm
  category: maintenance
  command: 'npm doctor'
  description: Checks that the npm environment works correctly.
  tags: [diagnostics]

# --- configuration ---
- tool: npm
  category: configuration
  command: 'npm config list'
  description: Shows the active npm configuration.
  tags: [config, list]
- tool: npm
  category: configuration
  command: 'npm config get {key}'
  description: Shows a configuration value.
  tags: [config]
  example: 'npm config get registry'
- tool: npm
  category: configuration
  command: 'npm config set {key} {value}'
  description: Changes a configuration value.
  tags: [config]
  example: 'npm config set save-exact true'

# --- publishing ---
- tool: npm
  category: publishing
  command: 'npm login'
  description: Logs in to the npm registry.
  tags: [login, account]
- tool: npm
  category: publishing
  command: 'npm whoami'
  description: User you are logged in as.
  tags: [user, account]
- tool: npm
  category: publishing
  command: 'npm pack --dry-run'
  description: Shows which files would be included when publishing, without publishing.
  tags: [publish, pack, dry-run]
- tool: npm
  category: publishing
  command: 'npm publish'
  description: Publishes the package to the registry (--access public for scoped packages).
  tags: [publish, release]
- tool: npm
  category: publishing
  command: 'npm link'
  description: Links the local package globally to test it in another project.
  tags: [link, local, development]
